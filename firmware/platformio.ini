[platformio]
default_envs = supermini_hw747_v002

[env:supermini_hw747_v002]
platform = espressif32 @ 7.0.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=0

; The photographed FH4R2 marking fixes 4 MB Quad-SPI in-package flash and 2 MB
; Quad-SPI in-package PSRAM. Upload/release approval still requires a successful
; physical flash, boot, PSRAM-detection, and serial-conformance test.
